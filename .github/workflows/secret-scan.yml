# Fails the push if a credential appears anywhere in the committed tree.
#
# It scans the checkout, not the history: the public repository starts with a
# fresh history, and the private one has public-by-design values in old commits
# (the Firebase web config) that are not worth rewriting history for. Deliberate
# fakes are marked inline with `gitleaks:allow`.
name: Secret scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --source . --redact --no-banner --verbose
